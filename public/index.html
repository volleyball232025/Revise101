function toggleAuth(){authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Welcome back':'Create your account';$('authBtn').textContent=authMode==='login'?'Sign in':'Create account';$('authSwitch').textContent=authMode==='login'?'Need an account? Create one':'Already have an account? Sign in'}
async function authSubmit(){try{$('authMsg').textContent='';await api('/api/'+authMode,{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});await boot()}catch(e){$('authMsg').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function boot(){let me=await api('/api/me');if(!me.loggedIn){$('auth').classList.remove('hidden');return}$('auth').classList.add('hidden');D=await api('/api/data');if(!D.surahs.length){$('onboarding').classList.remove('hidden');renderPicker();return}$('onboarding').classList.add('hidden');$('app').classList.remove('hidden');renderNav();show('home')}
function renderPicker(){let q=($('pickSearch')?.value||'').toLowerCase();$('pickGrid').innerHTML=S.map((s,i)=>{let n=i+1;if(q&&!(`${n} ${s.name} ${s.arabic}`).toLowerCase().includes(q))return'';let p=picker[n];return `<div class="pick ${p?'selected':''}" onclick="togglePick(${n})"><div class="pickTop"><b>${n}. ${s.name}</b><span class="arabic">${s.arabic}</span></div>${p?`<div class="stars" style="margin-top:8px" onclick="event.stopPropagation()">${starHTML(p,n,'pick')}</div>`:'<small class="muted">Tap to select</small>'}</div>`}).join('')}
function togglePick(n){if(picker[n])delete picker[n];else picker[n]=3;renderPicker()}function selectJuz30(){for(let n=78;n<=114;n++)picker[n]=3;renderPicker()}
function starHTML(r,id,mode='surah'){return [1,2,3,4,5,6].map(x=>`<span class="${x<=r?'on':''}" onclick="setRating('${mode}',${id},${x},event)">★</span>`).join('')}
async function setRating(mode,id,r,e){e?.stopPropagation();if(mode==='pick'){picker[id]=r;renderPicker();return}if(mode==='surah'){let sp=getSurah(id);await saveSurah(id,{...sp,rating:r});await reload();if(page==='surah')renderSurah()}else{let [s,a]=String(id).split('-').map(Number),ap=getAyah(s,a);await api(`/api/surahs/${s}/ayahs/${a}`,{method:'PUT',body:JSON.stringify({rating:r,weak:ap?.weak||r<=2})});await reload();renderSurah()}}
async function finishOnboarding(){let items=Object.entries(picker).map(([surah,rating])=>({surah:+surah,rating}));if(!items.length)return alert('Select at least one Surah.');await api('/api/onboarding',{method:'POST',body:JSON.stringify({surahs:items})});await boot()}
function renderNav(){let items=[['home','⌂','Home'],['surahs','☰','Surahs'],['homework','✓','Homework'],['stats','▥','Stats'],['settings','⚙','Settings']];$('nav').innerHTML=items.map(x=>`<button id="n-${x[0]}" onclick="show('${x[0]}')">${x[2]}</button>`).join('');$('mobileNav').innerHTML=items.map(x=>`<button onclick="show('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
async function reload(){D=await api('/api/data')};function getSurah(n){return D.surahs.find(x=>x.surah==n)}function getAyah(s,a){return D.ayahs.find(x=>x.surah==s&&x.ayah==a)}function memorized(){return D.surahs.filter(x=>x.memorized)}
function effectiveRating(sp){let aa=D.ayahs.filter(x=>x.surah==sp.surah&&x.rating);if(!aa.length)return sp.rating;return aa.reduce((a,x)=>a+x.rating,0)/aa.length}function overall(){let m=memorized();return m.length?Math.round(m.reduce((a,x)=>a+effectiveRating(x),0)/(m.length*6)*100):0}function fmtDate(ms){return ms?new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric',year:new Date(ms).getFullYear()!==new Date().getFullYear()?'numeric':undefined}):'Never'}
function readCount(days){let since=days?Date.now()-days*864e5:0;return D.logs.filter(x=>x.read_at>=since).reduce((a,x)=>a+(x.ayah_end-x.ayah_start+1),0)}function priorCount(days){let now=Date.now(),a=now-days*864e5,b=now-days*2*864e5;return D.logs.filter(x=>x.read_at>=b&&x.read_at<a).reduce((s,x)=>s+x.ayah_end-x.ayah_start+1,0)}function delta(days){let c=readCount(days),p=priorCount(days);return p?Math.round((c-p)/p*100):(c?100:0)}function qPct(n){return Math.min(100,n/6236*100).toFixed(1)}
function show(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$('n-'+p)?.classList.add('active');({home:renderHome,surahs:renderSurahs,homework:renderHomework,stats:renderStats,settings:renderSettings}[p]||renderHome)();scrollTo(0,0)}
function pref(k){return localStorage.getItem('widget_'+k)!=='0'}
function renderHome(){let pct=overall(),m=memorized(),rank=[...m].sort((a,b)=>effectiveRating(a)-effectiveRating(b)).slice(0,5);$('main').innerHTML=`<h1>Assalamu alaikum, ${esc(D.username)}</h1><p class="sub">Here is your memorization and revision overview.</p><div class="grid">${pref('strength')?`<section class="card strength"><h2>Overall Strength</h2><div class="ring" style="--pct:${pct}"><div class="ringText"><b>${pct}%</b><small>${m.length} Surahs memorized</small></div></div></section>`:''}${pref('activity')?`<section class="card activity"><h2>Quran Activity</h2><p class="sub">Ayahs logged as read. Percentage is of the full Quran.</p><div class="metricRow">${metric('7 days',7)}${metric('30 days',30)}${metric('1 year',365)}<div class="metric"><b>${qPct(readCount(0))}%</b><small>Lifetime · ${readCount(0)} ayahs</small></div></div></section>`:''}${pref('homework')?`<section class="card half"><div style="display:flex;justify-content:space-between"><h2>Today's Homework</h2><button class="ghost" onclick="show('homework')">Open →</button></div>${homeworkPreview()}</section>`:''}${pref('weakest')?`<section class="card half"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="rankTitle">Weakest Surahs</h2><button class="secondary" onclick="flipRank(this)">Show strongest</button></div><div id="rankChart">${rankChart(rank)}</div></section>`:''}${pref('recent')?`<section class="card full"><h2>Recently read</h2>${recentRows()}</section>`:''}</div>`}
function metric(label,d){let c=readCount(d),x=delta(d);return `<div class="metric"><b>${qPct(c)}%</b><small>${label} · ${c} ayahs</small><div class="${x>=0?'up':'down'}">${x>=0?'↑':'↓'} ${Math.abs(x)}% vs prior</div></div>`}
function rankChart(arr){return arr.length?arr.map(sp=>{let r=effectiveRating(sp);return `<div class="barRow"><span>${S[sp.surah-1].name}</span><div class="bar"><i style="width:${r/6*100}%"></i></div><b>${r.toFixed(1)}</b></div>`}).join(''):'<p class="muted">Rate some memorized Surahs to see rankings.</p>'}function flipRank(btn){let strong=btn.textContent.includes('strongest');let a=[...memorized()].sort((x,y)=>effectiveRating(x)-effectiveRating(y));if(strong)a.reverse();$('rankTitle').textContent=strong?'Strongest Surahs':'Weakest Surahs';btn.textContent=strong?'Show weakest':'Show strongest';$('rankChart').innerHTML=rankChart(a.slice(0,5))}
function recentRows(){let a=[...memorized()].sort((x,y)=>(y.last_read||0)-(x.last_read||0)).slice(0,4);return `<div class="surahList">${a.map(sp=>rowHTML(sp)).join('')}</div>`}
function rowHTML(sp){let s=S[sp.surah-1];return `<div class="surahRow" onclick="openSurah(${sp.surah})"><div class="num">${sp.surah}</div><div><b>${s.name}</b> <span class="arabic">${s.arabic}</span><div class="stars">${starHTML(Math.round(effectiveRating(sp)),sp.surah)}</div></div><span class="pill">${effectiveRating(sp).toFixed(1)}/6</span><span class="muted last">Last read: ${fmtDate(sp.last_read)}</span></div>`}
function renderSurahs(){let rows=memorized();$('main').innerHTML=`<h1>Your Surahs</h1><p class="sub">Open a Surah to manage weak ayahs, notes, ratings and last-read date.</p><div class="toolbar" style="margin-bottom:14px"><input id="surahSearch" class="search" placeholder="Search memorized Surahs" oninput="filterSurahs()"><button class="secondary" onclick="addSurahs()">+ Add memorized Surahs</button></div><div id="surahRows" class="surahList">${rows.map(rowHTML).join('')}</div>`}
function filterSurahs(){let q=$('surahSearch').value.toLowerCase();document.querySelectorAll('#surahRows .surahRow').forEach((el,i)=>el.style.display=el.innerText.toLowerCase().includes(q)?'grid':'none')}
function addSurahs(){picker={};memorized().forEach(x=>picker[x.surah]=x.rating);$('app').classList.add('hidden');$('onboarding').classList.remove('hidden');renderPicker()}
function openSurah(n){currentSurah=n;page='surah';renderSurah();scrollTo(0,0)}function renderSurah(){let sp=getSurah(currentSurah),s=S[currentSurah-1];if(!sp)return show('surahs');let weak=D.ayahs.filter(x=>x.surah==currentSurah&&x.weak);$('main').innerHTML=`<div style="margin-top:25px"><button class="ghost" onclick="show('surahs')">← All Surahs</button></div><div class="card"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><span class="pill">Surah ${currentSurah}</span><h1 style="margin-top:8px">${s.name} <span class="arabic">${s.arabic}</span></h1><div class="stars" style="font-size:23px">${starHTML(sp.rating,currentSurah)}</div><p class="muted">${s.ayahs} ayahs · Last read: <b>${fmtDate(sp.last_read)}</b></p></div><div class="toolbar"><button class="primary" onclick="readToday()">✓ I read this Surah today</button><input type="date" id="readDate" style="width:auto" onchange="customRead(this.value)"></div></div><div class="tabs"><button class="${detailTab==='weak'?'active':''}" onclick="detailTab='weak';renderSurah()">Weak Ayahs (${weak.length})</button><button class="${detailTab==='all'?'active':''}" onclick="detailTab='all';renderSurah()">All Ayahs</button><button class="${detailTab==='notes'?'active':''}" onclick="detailTab='notes';renderSurah()">Notes</button></div><div id="detailBody">${detailTab==='notes'?notesHTML(sp):ayahsHTML(s,detailTab==='weak')}</div></div>`}
function ayahsHTML(s,onlyWeak){let list=[];for(let a=1;a<=s.ayahs;a++){let ap=getAyah(currentSurah,a),isWeak=!!ap?.weak;if(onlyWeak&&!isWeak)continue;list.push(`<div class="ayah ${isWeak?'weak':''}" onclick="toggleWeak(${a},${!isWeak})"><b>Ayah ${a}</b><div class="ayahStatus">${isWeak?'🔴 Weak':'🟢 Strong'}</div></div>`)}return list.length?`<div class="ayahGrid">${list.join('')}</div>`:'<p class="muted">No ayahs are marked weak in this Surah.</p>'}
function notesHTML(sp){return `<textarea id="notes" placeholder="Notes for this Surah only...">${esc(sp.notes||'')}</textarea><div style="margin-top:10px"><button class="primary" onclick="saveNotes()">Save notes</button></div>`}
async function toggleWeak(a,w){let ap=getAyah(currentSurah,a);await api(`/api/surahs/${currentSurah}/ayahs/${a}`,{method:'PUT',body:JSON.stringify({rating:ap?.rating||(w?2:null),weak:w})});await reload();renderSurah()}async function saveSurah(n,sp){await api('/api/surahs/'+n,{method:'PUT',body:JSON.stringify(sp)})}async function saveNotes(){let sp=getSurah(currentSurah);await saveSurah(currentSurah,{...sp,notes:$('notes').value});await reload();renderSurah()}async function readToday(){let s=S[currentSurah-1];await api('/api/read',{method:'POST',body:JSON.stringify({surah:currentSurah,ayah_start:1,ayah_end:s.ayahs,read_at:Date.now(),kind:'review'})});await reload();renderSurah()}async function customRead(v){if(!v)return;let s=S[currentSurah-1],at=new Date(v+'T12:00:00').getTime();await api('/api/read',{method:'POST',body:JSON.stringify({surah:currentSurah,ayah_start:1,ayah_end:s.ayahs,read_at:at,kind:'review'})});await reload();renderSurah()}
function homeworkCandidates(){let now=Date.now(),out=[];for(const sp of memorized()){let s=S[sp.surah-1],aps=D.ayahs.filter(x=>x.surah==sp.surah),has=aps.length>0;if(has){for(const ap of aps){let rating=ap.rating||sp.rating,days=(now-(sp.last_read||0))/864e5,score=(7-rating)*3+(ap.weak?8:0)+Math.min(12,days/7);out.push({surah:sp.surah,ayah:ap.ayah,rating,score})}}else{let days=(now-(sp.last_read||0))/864e5;for(let a=1;a<=s.ayahs;a++)out.push({surah:sp.surah,ayah:a,rating:sp.rating,score:(7-sp.rating)*3+Math.min(12,days/7)})}}return out}
function learnedSecPerAyah(){let done=D.homework.filter(x=>x.completed_at&&x.actual_minutes&&x.payload?.totalAyahs);if(!done.length)return 22;return Math.max(8,Math.min(90,done.reduce((a,x)=>a+x.actual_minutes*60/x.payload.totalAyahs,0)/done.length))}
function planHomework(minutes){let cap=Math.max(1,Math.floor(minutes*60/learnedSecPerAyah())),cand=homeworkCandidates().sort((a,b)=>b.score-a.score),chosen=cand.slice(0,cap).sort((a,b)=>a.surah-b.surah||a.ayah-b.ayah),groups=[];for(const x of chosen){let g=groups.at(-1);if(g&&g.surah===x.surah&&x.ayah===g.end+1)g.end=x.ayah;else groups.push({surah:x.surah,start:x.ayah,end:x.ayah})}return {groups,totalAyahs:chosen.length,estimatedMinutes:Math.max(1,Math.round(chosen.length*learnedSecPerAyah()/60))}}
function renderHomework(){let latest=D.homework.find(x=>!x.completed_at);$('main').innerHTML=`<h1>AI Homework</h1><p class="sub">Builds an ordered revision assignment from your weakest, lowest-rated and longest-unread material, sized to your available time.</p><div class="grid"><section class="card half"><h2>Create today's assignment</h2><label>How much time do you have?</label><select id="hwMin"><option>10</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select><button class="primary" style="margin-top:12px" onclick="createHomework()">Generate homework</button><p class="muted">Assignments stay in Quran order after priorities are chosen.</p></section><section class="card half"><h2>Current assignment</h2>${latest?homeworkCard(latest):'<p class="muted">No active homework. Generate an assignment when you are ready to review.</p>'}</section><section class="card full"><h2>Homework history</h2>${D.homework.filter(x=>x.completed_at).slice(0,10).map(x=>`<div class="homeworkItem"><b>${new Date(x.assigned_at).toLocaleDateString()}</b> · ${x.payload.totalAyahs} ayahs · ${x.actual_minutes} min actual</div>`).join('')||'<p class="muted">Completed assignments will appear here.</p>'}</section></div>`}
function homeworkCard(h){return `<span class="pill">~${h.payload.estimatedMinutes} min · ${h.payload.totalAyahs} ayahs</span>${h.payload.groups.map(g=>`<div class="homeworkItem"><b>${S[g.surah-1].name}</b><br>Ayahs ${g.start}${g.end>g.start?'–'+g.end:''}</div>`).join('')}<div class="toolbar" style="margin-top:12px"><input id="actualMin" type="number" min="1" value="${h.minutes_target}" placeholder="Actual minutes"><button class="primary" onclick="completeHomework('${h.id}')">Complete homework</button></div>`}
async function createHomework(){let minutes=+$('hwMin').value,payload=planHomework(minutes);if(!payload.totalAyahs)return alert('Add memorized Surahs first.');await api('/api/homework',{method:'POST',body:JSON.stringify({minutes,payload})});await reload();renderHomework()}async function completeHomework(id){let actual=+$('actualMin').value||1;await api(`/api/homework/${id}/complete`,{method:'POST',body:JSON.stringify({actual_minutes:actual})});await reload();renderHomework()}
function homeworkPreview(){let h=D.homework.find(x=>!x.completed_at);return h?homeworkCard(h):'<p class="muted">No homework assigned yet.</p><button class="primary" onclick="show(\'homework\')">Create homework</button>'}
function renderStats(){let m=memorized(),total=m.reduce((a,x)=>a+S[x.surah-1].ayahs,0),weak=D.ayahs.filter(x=>x.weak).length,rank=[...m].sort((a,b)=>effectiveRating(a)-effectiveRating(b));$('main').innerHTML=`<h1>Stats</h1><p class="sub">Your detailed memorization, strength and reading activity.</p><div class="grid"><section class="card full"><div class="metricRow"><div class="metric"><b>${total.toLocaleString()}</b><small>Ayahs memorized</small></div><div class="metric"><b>${weak}</b><small>Weak ayahs</small></div><div class="metric"><b>${m.length}</b><small>Surahs memorized</small></div><div class="metric"><b>${overall()}%</b><small>Overall strength</small></div></div></section><section class="card half"><h2>Quran read</h2>${[['Last 7 days',7],['Last 30 days',30],['Last year',365],['Lifetime',0]].map(([l,d])=>`<div class="homeworkItem"><b>${l}</b><span style="float:right">${readCount(d)} ayahs · ${qPct(readCount(d))}%</span></div>`).join('')}</section><section class="card half"><h2>Weakest Surahs</h2>${rankChart(rank.slice(0,8))}</section></div>`}
function renderSettings(){let keys=[['strength','Overall strength'],['activity','Quran activity'],['homework',"Today's homework"],['weakest','Weakest/strongest chart'],['recent','Recently read']];$('main').innerHTML=`<h1>Settings</h1><p class="sub">Customize what appears on your home page.</p><div class="card"><h2>Home widgets</h2>${keys.map(([k,l])=>`<div class="settingsRow"><span>${l}</span><button class="switch ${pref(k)?'on':''}" onclick="togglePref('${k}',this)"><i></i></button></div>`).join('')}</div>`}function togglePref(k,b){localStorage.setItem('widget_'+k,pref(k)?'0':'1');b.classList.toggle('on')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}boot().catch(e=>{$('authMsg').textContent=e.message});</script></body></html>
